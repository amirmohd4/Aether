[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://aether-backend-9laf.onrender.com"
  VITE_SUPABASE_URL = "https://lekudqjewxxunqjuqayi.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_1zr-O35OIeQVgBfnAVnXaQ_AewTZBqI"
  VITE_REQUIRE_AUTH = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
