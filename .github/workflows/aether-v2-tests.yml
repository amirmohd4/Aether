name: Aether MVP Tests

on:
  push:
    branches:
      - aether-mvp-build
      - main
  pull_request:
    branches:
      - main
      - aether-mvp-build

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q aether_core
      - run: PYTHONPATH=. pytest -q tests
