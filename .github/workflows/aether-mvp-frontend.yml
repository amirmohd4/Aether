name: Aether MVP Frontend

on:
  push:
    branches:
      - aether-mvp-build
      - main
  pull_request:
    branches:
      - aether-mvp-build
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
