services:
  - type: web
    name: aether-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    ipAllowList: []
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8081
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
